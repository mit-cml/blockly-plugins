<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The parts of a note</title>
  <desc>A note at its default size of 260 by 180, with its title, hairline rule, card, body and resize handle labelled.</desc>

  <rect width="920" height="300" fill="#ffffff"/>

  <!-- The note: default size 260 x 180, top-left at (332, 56). -->
  <g transform="translate(332, 56)">
    <rect width="260" height="180" rx="8" ry="8" fill="#f9edbb" stroke="#dbd0a4" stroke-width="1"/>

    <!-- Title: 16px bold, centred in the 16px line box that starts at y=16. -->
    <text x="16" y="24" font-size="16" font-weight="bold" fill="#000000" dominant-baseline="middle">Shopping list</text>

    <!-- The rule, at y=40: midway between the title's line box and the body. -->
    <line x1="16" y1="40" x2="244" y2="40" stroke="#dbd0a4" stroke-width="1"/>

    <!-- Body text, below the 48px title row and inset by the same margin. -->
    <g font-size="14.67" fill="#000000">
      <text x="16" y="66">milk</text>
      <text x="16" y="86">bread</text>
      <text x="16" y="106">coffee</text>
    </g>

    <!-- Resize handle: 12x12, pulled 16px in from each edge. -->
    <g stroke="#5f6368" stroke-width="1.4" fill="none" opacity="0.65" stroke-linecap="round">
      <path d="M232 156 L 244 144"/>
      <path d="M238 162 L 244 156"/>
    </g>
  </g>

  <!-- Leader lines. Each ends on the edge of the part it names. -->
  <g stroke="#9aa0a6" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M258 80 H 328"/>
    <path d="M258 208 H 300 L 326 226"/>
    <path d="M652 96 H 596"/>
    <path d="M652 152 H 596"/>
    <path d="M652 220 H 600 L 578 212"/>
  </g>

  <g font-size="14" fill="#202124">
    <text x="250" y="76" text-anchor="end" font-weight="600">Title</text>
    <text x="250" y="94" text-anchor="end" font-size="12.5" fill="#5f6368">click it and type</text>

    <text x="250" y="204" text-anchor="end" font-weight="600">The card</text>
    <text x="250" y="222" text-anchor="end" font-size="12.5" fill="#5f6368">pale fill, hairline edge</text>

    <text x="664" y="92" font-weight="600">Rule</text>
    <text x="664" y="110" font-size="12.5" fill="#5f6368">equal air above and below</text>

    <text x="664" y="148" font-weight="600">The body</text>
    <text x="664" y="166" font-size="12.5" fill="#5f6368">written onto the paper,</text>
    <text x="664" y="184" font-size="12.5" fill="#5f6368">with no box around it</text>

    <text x="664" y="216" font-weight="600">Resize handle</text>
    <text x="664" y="234" font-size="12.5" fill="#5f6368">inside the sheet, not on its corner</text>
  </g>

  <!-- The margin, called out once: it is the same on all four sides. -->
  <g stroke="#bdc1c6" stroke-width="1" fill="none">
    <path d="M332 258 H 348"/>
    <path d="M332 253 V 263"/>
    <path d="M348 253 V 263"/>
  </g>
  <text x="356" y="262" font-size="12" fill="#80868b">a margin of 16, the same on every side</text>
</svg>
