<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>

  <g font-size="12" fill="#3c4043" font-weight="600">
    <text x="30" y="28">A plain Blockly comment</text>
    <text x="300" y="28">A note</text>
    <text x="570" y="28">Not named yet</text>
    <text x="30" y="240">Collapsed</text>
    <text x="300" y="240">Pinned</text>
    <text x="570" y="240">Selected</text>
  </g>
  <g font-size="11" fill="#80868b">
    <text x="30" y="44">header strip, text in a box</text>
    <text x="300" y="44">rounded, heading on the paper</text>
    <text x="570" y="44">greyed placeholder</text>
    <text x="30" y="256">the title row is the whole note</text>
    <text x="300" y="256">locked in place, heavier edge</text>
    <text x="570" y="256">the ring follows the card</text>
  </g>

  <!-- 1. Blockly's own comment, for comparison -->
  <g transform="translate(30, 60)">
    <rect width="230" height="140" fill="#fffcc7" stroke="#f2e49b" stroke-width="1"/>
    <rect width="230" height="24" fill="#f2e49b"/>
    <path d="M6 8 L 18 8 L 12 16 Z" fill="#041e49"/>
    <rect x="4" y="28" width="222" height="108" fill="#fffcc7" stroke="#f2e49b" stroke-width="1"/>
    <text x="10" y="46" font-size="11" fill="#000000">Refactor this loop</text>
  </g>

  <!-- 2. A note -->
  <g transform="translate(300, 60)">
    <rect width="230" height="140" rx="8" ry="8" fill="#f9edbb" stroke="#dbd0a4" stroke-width="1"/>
    <text x="16" y="24" font-size="16" font-weight="bold" fill="#000000" dominant-baseline="middle">Shopping list</text>
    <line x1="16" y1="40" x2="214" y2="40" stroke="#dbd0a4" stroke-width="1"/>
    <g font-size="14.67" fill="#000000">
      <text x="16" y="62">milk</text>
      <text x="16" y="78">bread</text>
      <text x="16" y="94">coffee</text>
    </g>
  </g>

  <!-- 3. Untitled -->
  <g transform="translate(570, 60)">
    <rect width="200" height="140" rx="8" ry="8" fill="#bbe5f9" stroke="#a4c9db" stroke-width="1"/>
    <text x="16" y="24" font-size="16" font-weight="bold" fill="#999999" dominant-baseline="middle">Title</text>
    <line x1="16" y1="40" x2="184" y2="40" stroke="#a4c9db" stroke-width="1"/>
    <text x="16" y="62" font-size="14.67" fill="#000000">Say something...</text>
  </g>

  <!-- 4. Collapsed: the title row is the whole note -->
  <g transform="translate(30, 272)">
    <rect width="230" height="48" rx="8" ry="8" fill="#bbf9da" stroke="#a4dbbf" stroke-width="1"/>
    <text x="16" y="24" font-size="16" font-weight="bold" fill="#000000" dominant-baseline="middle">Release checklist</text>
  </g>

  <!-- 5. Pinned -->
  <g transform="translate(300, 272)">
    <rect x="1" y="1" width="228" height="106" rx="8" ry="8" fill="#f9bbc5" stroke="#dba4ad" stroke-width="2"/>
    <text x="16" y="24" font-size="16" font-weight="bold" fill="#000000" dominant-baseline="middle">Do not move</text>
    <line x1="16" y1="40" x2="214" y2="40" stroke="#dba4ad" stroke-width="1"/>
    <text x="16" y="62" font-size="14.67" fill="#000000">Locked in place.</text>
  </g>

  <!-- 6. Selected -->
  <g transform="translate(570, 272)">
    <rect x="1.5" y="1.5" width="197" height="105" rx="8" ry="8" fill="#dfbbf9" stroke="#c3a4db" stroke-width="1"/>
    <rect x="1.5" y="1.5" width="197" height="105" rx="8" ry="8" fill="none" stroke="#ffcc33" stroke-width="3"/>
    <text x="17" y="24" font-size="16" font-weight="bold" fill="#000000" dominant-baseline="middle">Ideas</text>
    <line x1="17" y1="40" x2="183" y2="40" stroke="#c3a4db" stroke-width="1"/>
    <text x="17" y="62" font-size="14.67" fill="#000000">Try a smaller step.</text>
  </g>
</svg>
