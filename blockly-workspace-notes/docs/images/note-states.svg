<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The states a note can be in</title>
  <desc>Six notes: a named note, one not named yet, a collapsed one, a pinned one showing its marker, a selected one, and a locked one showing a padlock and no delete button.</desc>

  <rect width="920" height="540" fill="#ffffff"/>

  <text x="40" y="44" font-size="14" fill="#202124" font-weight="600">Named</text>
  <text x="40" y="64" font-size="12.5" fill="#5f6368">the title is what you scan for</text>
  <g transform="translate(40, 80)">
    <rect x="0.5" y="0.5" width="259" height="179" fill="#f9edbb" stroke="#dbd0a4" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="259" height="35" fill="#dbd0a4"/>
    <g transform="translate(10.000, 10.000) scale(0.6667)" fill="none"
       stroke="#4c4217" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></g>
    <g transform="translate(234.000, 10.000) scale(0.6667)" fill="none"
       stroke="#4c4217" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></g>
    <text x="31.000" y="18.0" font-size="16" font-weight="bold" fill="#4c4217" dominant-baseline="central">Shopping list</text>
    <text x="10" y="58" font-size="14.67" fill="#4c4217">milk</text>
    <text x="10" y="78" font-size="14.67" fill="#4c4217">bread</text>
    <g transform="translate(10.000, 156.000) scale(0.5000)" fill="none"
       stroke="#4c4217" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" opacity="0.6"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></g>
    <text x="25" y="162.0" font-size="11" fill="#4c4217" opacity="0.6" dominant-baseline="central">ada</text>
    <g transform="translate(51.800, 156.000) scale(0.5000)" fill="none"
       stroke="#4c4217" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" opacity="0.6"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"/><path d="M16 3l0 4"/><path d="M8 3l0 4"/><path d="M4 11l16 0"/><path d="M8 15h2v2h-2l0 -2"/></g>
    <text x="66.8" y="162.0" font-size="11" fill="#4c4217" opacity="0.6" dominant-baseline="central">9 Sep 2026</text>
  </g>

  <text x="330" y="44" font-size="14" fill="#202124" font-weight="600">Not named yet</text>
  <text x="330" y="64" font-size="12.5" fill="#5f6368">faded placeholders, both rows</text>
  <g transform="translate(330, 80)">
    <rect x="0.5" y="0.5" width="259" height="179" fill="#bbe5f9" stroke="#a4c9db" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="259" height="35" fill="#a4c9db"/>
    <g transform="translate(10.000, 10.000) scale(0.6667)" fill="none"
       stroke="#173b4c" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></g>
    <g transform="translate(234.000, 10.000) scale(0.6667)" fill="none"
       stroke="#173b4c" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></g>
    <text x="31.000" y="18.0" font-size="16" font-weight="bold" fill="#173b4c" opacity="0.55" dominant-baseline="central">Title</text>
    <text x="10" y="58" font-size="14.67" fill="#173b4c" opacity="0.55">Say something...</text>
    <g transform="translate(10.000, 156.000) scale(0.5000)" fill="none"
       stroke="#173b4c" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" opacity="0.6"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"/><path d="M16 3l0 4"/><path d="M8 3l0 4"/><path d="M4 11l16 0"/><path d="M8 15h2v2h-2l0 -2"/></g>
    <text x="25" y="162.0" font-size="11" fill="#173b4c" opacity="0.6" dominant-baseline="central">9 Sep 2026</text>
  </g>

  <text x="620" y="44" font-size="14" fill="#202124" font-weight="600">Collapsed</text>
  <text x="620" y="64" font-size="12.5" fill="#5f6368">the bar is the whole note</text>
  <g transform="translate(620, 80)">
    <rect x="0.5" y="0.5" width="259" height="35" fill="#bbf9da" stroke="#a4dbbf" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="259" height="35" fill="#a4dbbf"/>
    <g transform="translate(10.000, 10.000) scale(0.6667)" fill="none"
       stroke="#174c31" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><g transform="rotate(-90 12 12)"><path d="M6 9l6 6l6 -6"/></g></g>
    <g transform="translate(234.000, 10.000) scale(0.6667)" fill="none"
       stroke="#174c31" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></g>
    <text x="31.000" y="18.0" font-size="16" font-weight="bold" fill="#174c31" dominant-baseline="central">Release checklist</text>
  </g>

  <text x="40" y="294" font-size="14" fill="#202124" font-weight="600">Pinned</text>
  <text x="40" y="314" font-size="12.5" fill="#5f6368">a pin in the bar, and a heavier edge</text>
  <g transform="translate(40, 330)">
    <rect x="1.0" y="1.0" width="258" height="178" fill="#f9bbc5" stroke="#dba4ad" stroke-width="2"/>
    <rect x="1.0" y="1.0" width="258" height="34" fill="#dba4ad"/>
    <g transform="translate(10.000, 10.000) scale(0.6667)" fill="none"
       stroke="#4c171f" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></g>
    <g transform="translate(234.000, 10.000) scale(0.6667)" fill="none"
       stroke="#4c171f" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></g>
    <g transform="translate(26.333, 9.667) scale(0.6667)" fill="none"
       stroke="#4c171f" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M9 4v6l-2 4v2h10v-2l-2 -4v-6"/><path d="M12 16l0 5"/><path d="M8 4l8 0"/></g>
    <text x="42.667" y="18.0" font-size="16" font-weight="bold" fill="#4c171f" dominant-baseline="central">Do not move</text>
    <text x="10" y="58" font-size="14.67" fill="#4c171f">Held in place.</text>
    <g transform="translate(10.000, 156.000) scale(0.5000)" fill="none"
       stroke="#4c171f" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" opacity="0.6"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></g>
    <text x="25" y="162.0" font-size="11" fill="#4c171f" opacity="0.6" dominant-baseline="central">ada</text>
    <g transform="translate(51.800, 156.000) scale(0.5000)" fill="none"
       stroke="#4c171f" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" opacity="0.6"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"/><path d="M16 3l0 4"/><path d="M8 3l0 4"/><path d="M4 11l16 0"/><path d="M8 15h2v2h-2l0 -2"/></g>
    <text x="66.8" y="162.0" font-size="11" fill="#4c171f" opacity="0.6" dominant-baseline="central">9 Sep 2026</text>
  </g>

  <text x="330" y="294" font-size="14" fill="#202124" font-weight="600">Selected</text>
  <text x="330" y="314" font-size="12.5" fill="#5f6368">the ring follows the card</text>
  <g transform="translate(330, 330)">
    <rect x="0.5" y="0.5" width="259" height="179" fill="#dfbbf9" stroke="#c4a4db" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="259" height="35" fill="#c4a4db"/>
    <g transform="translate(10.000, 10.000) scale(0.6667)" fill="none"
       stroke="#36174c" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></g>
    <g transform="translate(234.000, 10.000) scale(0.6667)" fill="none"
       stroke="#36174c" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></g>
    <text x="31.000" y="18.0" font-size="16" font-weight="bold" fill="#36174c" dominant-baseline="central">Ideas</text>
    <text x="10" y="58" font-size="14.67" fill="#36174c">Try a smaller step.</text>
    <g transform="translate(10.000, 156.000) scale(0.5000)" fill="none"
       stroke="#36174c" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" opacity="0.6"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></g>
    <text x="25" y="162.0" font-size="11" fill="#36174c" opacity="0.6" dominant-baseline="central">ada</text>
    <g transform="translate(51.800, 156.000) scale(0.5000)" fill="none"
       stroke="#36174c" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" opacity="0.6"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"/><path d="M16 3l0 4"/><path d="M8 3l0 4"/><path d="M4 11l16 0"/><path d="M8 15h2v2h-2l0 -2"/></g>
    <text x="66.8" y="162.0" font-size="11" fill="#36174c" opacity="0.6" dominant-baseline="central">9 Sep 2026</text>
    <rect x="1.5" y="1.5" width="257" height="177" fill="none" stroke="#ffcc33" stroke-width="3"/>
  </g>

  <text x="620" y="294" font-size="14" fill="#202124" font-weight="600">Locked</text>
  <text x="620" y="314" font-size="12.5" fill="#5f6368">a padlock in the bar, and no bin</text>
  <g transform="translate(620, 330)">
    <rect x="0.5" y="0.5" width="259" height="179" fill="#f9d8bb" stroke="#dbbea4" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="259" height="35" fill="#dbbea4"/>
    <g transform="translate(10.000, 10.000) scale(0.6667)" fill="none"
       stroke="#4c3017" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></g>
    <g transform="translate(27.667, 10.000) scale(0.6667)" fill="none"
       stroke="#4c3017" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6"/><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"/><path d="M8 11v-4a4 4 0 1 1 8 0v4"/></g>
    <text x="45.333" y="18.0" font-size="16" font-weight="bold" fill="#4c3017" dominant-baseline="central">Read the brief</text>
    <text x="10" y="58" font-size="14.67" fill="#4c3017">Written by your teacher.</text>
    <g transform="translate(10.000, 156.000) scale(0.5000)" fill="none"
       stroke="#4c3017" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" opacity="0.6"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></g>
    <text x="25" y="162.0" font-size="11" fill="#4c3017" opacity="0.6" dominant-baseline="central">ada</text>
    <g transform="translate(51.800, 156.000) scale(0.5000)" fill="none"
       stroke="#4c3017" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" opacity="0.6"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"/><path d="M16 3l0 4"/><path d="M8 3l0 4"/><path d="M4 11l16 0"/><path d="M8 15h2v2h-2l0 -2"/></g>
    <text x="66.8" y="162.0" font-size="11" fill="#4c3017" opacity="0.6" dominant-baseline="central">9 Sep 2026</text>
  </g>

</svg>
