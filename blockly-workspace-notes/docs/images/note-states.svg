<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The states a note can be in</title>
  <desc>Five notes at their default size: a named note, one not named yet, a collapsed one, a pinned one and a selected one.</desc>

  <rect width="920" height="600" fill="#ffffff"/>

  <g font-size="14" fill="#202124" font-weight="600">
    <text x="40" y="44">Named</text>
    <text x="330" y="44">Not named yet</text>
    <text x="620" y="44">Collapsed</text>
    <text x="40" y="344">Pinned</text>
    <text x="330" y="344">Selected</text>
  </g>
  <g font-size="12.5" fill="#5f6368">
    <text x="40" y="64">the title is what you scan for</text>
    <text x="330" y="64">greyed placeholders, both rows</text>
    <text x="620" y="64">the title row is the whole note</text>
    <text x="40" y="364">locked in place, heavier edge</text>
    <text x="330" y="364">the ring follows the card</text>
  </g>

  <!-- Named: the default note, 260 x 180. -->
  <g transform="translate(40, 84)">
    <rect width="260" height="180" rx="8" ry="8" fill="#f9edbb" stroke="#dbd0a4" stroke-width="1"/>
    <text x="16" y="24" font-size="16" font-weight="bold" fill="#000000" dominant-baseline="middle">Shopping list</text>
    <line x1="16" y1="40" x2="244" y2="40" stroke="#dbd0a4" stroke-width="1"/>
    <g font-size="14.67" fill="#000000">
      <text x="16" y="66">milk</text>
      <text x="16" y="86">bread</text>
      <text x="16" y="106">coffee</text>
    </g>
  </g>

  <!-- Not named yet: the title placeholder, and core's own body placeholder. -->
  <g transform="translate(330, 84)">
    <rect width="260" height="180" rx="8" ry="8" fill="#bbe5f9" stroke="#a4c9db" stroke-width="1"/>
    <text x="16" y="24" font-size="16" font-weight="bold" fill="#999999" dominant-baseline="middle">Title</text>
    <line x1="16" y1="40" x2="244" y2="40" stroke="#a4c9db" stroke-width="1"/>
    <text x="16" y="66" font-size="14.67" fill="#999999">Say something...</text>
  </g>

  <!-- Collapsed: 48px, the title row alone. No rule — nothing to divide. -->
  <g transform="translate(620, 84)">
    <rect width="260" height="48" rx="8" ry="8" fill="#bbf9da" stroke="#a4dbbf" stroke-width="1"/>
    <text x="16" y="24" font-size="16" font-weight="bold" fill="#000000" dominant-baseline="middle">Release checklist</text>
  </g>

  <!-- Pinned: the same note with a 2px edge instead of 1px. -->
  <g transform="translate(40, 384)">
    <rect x="1" y="1" width="258" height="178" rx="8" ry="8" fill="#f9bbc5" stroke="#dba4ad" stroke-width="2"/>
    <text x="16" y="24" font-size="16" font-weight="bold" fill="#000000" dominant-baseline="middle">Do not move</text>
    <line x1="16" y1="40" x2="244" y2="40" stroke="#dba4ad" stroke-width="1"/>
    <text x="16" y="66" font-size="14.67" fill="#000000">Locked in place.</text>
  </g>

  <!-- Selected: Blockly's own 3px #fc3 ring, drawn on the card. -->
  <g transform="translate(330, 384)">
    <rect x="1.5" y="1.5" width="257" height="177" rx="8" ry="8" fill="#dfbbf9" stroke="#c4a4db" stroke-width="1"/>
    <rect x="1.5" y="1.5" width="257" height="177" rx="8" ry="8" fill="none" stroke="#ffcc33" stroke-width="3"/>
    <text x="16" y="24" font-size="16" font-weight="bold" fill="#000000" dominant-baseline="middle">Ideas</text>
    <line x1="16" y1="40" x2="244" y2="40" stroke="#c4a4db" stroke-width="1"/>
    <text x="16" y="66" font-size="14.67" fill="#000000">Try a smaller step.</text>
  </g>
</svg>
