<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The states a note can be in</title>
  <desc>Five notes: a named note, one not named yet, a collapsed one, a pinned one showing its marker, and a selected one.</desc>

  <rect width="920" height="520" fill="#ffffff"/>

  <text x="40" y="44" font-size="14" fill="#202124" font-weight="600">Named</text>
  <text x="40" y="64" font-size="12.5" fill="#5f6368">the title is what you scan for</text>
  <g transform="translate(40, 80)">
    <rect x="0.5" y="0.5" width="259" height="169" fill="#f9edbb" stroke="#dbd0a4" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="259" height="35" fill="#dbd0a4"/>
    <g transform="translate(10.0, 10.0) scale(0.6667)" fill="none" stroke="#4c4217"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g><path d="M6 9l6 6l6 -6"/></g>
    </g>
    <g transform="translate(234.0, 10.0) scale(0.6667)" fill="none" stroke="#4c4217"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></g>
    </g>
    <text x="31.000" y="18.0" font-size="16" font-weight="bold" fill="#4c4217" dominant-baseline="middle">Shopping list</text>
    <text x="10" y="58" font-size="14.67" fill="#4c4217">milk</text>
    <text x="10" y="78" font-size="14.67" fill="#4c4217">bread</text>
    <text x="10" y="98" font-size="14.67" fill="#4c4217">coffee</text>
  </g>

  <text x="330" y="44" font-size="14" fill="#202124" font-weight="600">Not named yet</text>
  <text x="330" y="64" font-size="12.5" fill="#5f6368">faded placeholders, both rows</text>
  <g transform="translate(330, 80)">
    <rect x="0.5" y="0.5" width="259" height="169" fill="#bbe5f9" stroke="#a4c9db" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="259" height="35" fill="#a4c9db"/>
    <g transform="translate(10.0, 10.0) scale(0.6667)" fill="none" stroke="#173b4c"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g><path d="M6 9l6 6l6 -6"/></g>
    </g>
    <g transform="translate(234.0, 10.0) scale(0.6667)" fill="none" stroke="#173b4c"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></g>
    </g>
    <text x="31.000" y="18.0" font-size="16" font-weight="bold" fill="#173b4c" opacity="0.55" dominant-baseline="middle">Title</text>
    <text x="10" y="58" font-size="14.67" fill="#173b4c" opacity="0.55">Say something...</text>
  </g>

  <text x="620" y="44" font-size="14" fill="#202124" font-weight="600">Collapsed</text>
  <text x="620" y="64" font-size="12.5" fill="#5f6368">the bar is the whole note</text>
  <g transform="translate(620, 80)">
    <rect x="0.5" y="0.5" width="259" height="35" fill="#bbf9da" stroke="#a4dbbf" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="259" height="35" fill="#a4dbbf"/>
    <g transform="translate(10.0, 10.0) scale(0.6667)" fill="none" stroke="#174c31"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g transform="rotate(-90 12 12)"><path d="M6 9l6 6l6 -6"/></g>
    </g>
    <g transform="translate(234.0, 10.0) scale(0.6667)" fill="none" stroke="#174c31"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></g>
    </g>
    <text x="31.000" y="18.0" font-size="16" font-weight="bold" fill="#174c31" dominant-baseline="middle">Release checklist</text>
  </g>

  <text x="40" y="284" font-size="14" fill="#202124" font-weight="600">Pinned</text>
  <text x="40" y="304" font-size="12.5" fill="#5f6368">a pin in the bar, and a heavier edge</text>
  <g transform="translate(40, 320)">
    <rect x="1.0" y="1.0" width="258" height="168" fill="#f9bbc5" stroke="#dba4ad" stroke-width="2"/>
    <rect x="1.0" y="1.0" width="258" height="34" fill="#dba4ad"/>
    <g transform="translate(10.0, 10.0) scale(0.6667)" fill="none" stroke="#4c171f"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g><path d="M6 9l6 6l6 -6"/></g>
    </g>
    <g transform="translate(234.0, 10.0) scale(0.6667)" fill="none" stroke="#4c171f"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></g>
    </g>
    <g transform="translate(26.333, 9.667) scale(0.6667)" fill="none"
       stroke="#4c171f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4v6l-2 4v2h10v-2l-2 -4v-6"/><path d="M12 16l0 5"/><path d="M8 4l8 0"/>
    </g>
    <text x="42.667" y="18.0" font-size="16" font-weight="bold" fill="#4c171f" dominant-baseline="middle">Do not move</text>
    <text x="10" y="58" font-size="14.67" fill="#4c171f">Locked in place.</text>
  </g>

  <text x="330" y="284" font-size="14" fill="#202124" font-weight="600">Selected</text>
  <text x="330" y="304" font-size="12.5" fill="#5f6368">the ring follows the card</text>
  <g transform="translate(330, 320)">
    <rect x="0.5" y="0.5" width="259" height="169" fill="#dfbbf9" stroke="#c4a4db" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="259" height="35" fill="#c4a4db"/>
    <rect x="1.5" y="1.5" width="257" height="167" fill="none" stroke="#ffcc33" stroke-width="3"/>
    <g transform="translate(10.0, 10.0) scale(0.6667)" fill="none" stroke="#36174c"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g><path d="M6 9l6 6l6 -6"/></g>
    </g>
    <g transform="translate(234.0, 10.0) scale(0.6667)" fill="none" stroke="#36174c"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></g>
    </g>
    <text x="31.000" y="18.0" font-size="16" font-weight="bold" fill="#36174c" dominant-baseline="middle">Ideas</text>
    <text x="10" y="58" font-size="14.67" fill="#36174c">Try a smaller step.</text>
  </g>

</svg>
